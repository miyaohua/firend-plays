<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <title>改枪坊</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand__title">改枪坊</span>
        <span class="brand__subtitle">好友玩旗下平台(www.hafubi.net)</span>
      </div>

      <div class="header-actions">
        <span id="status" class="status status--idle"></span>
        <button id="refresh" class="button button--ghost" type="button">刷新</button>
        <button id="loginBtn" class="button button--primary" type="button">登录</button>
        <div id="userBox" class="user-box" hidden>
          <button id="userMenuBtn" class="user-menu" type="button">
            <span id="userAvatar" class="user-avatar"></span>
            <span id="userName" class="user-name"></span>
            <span class="user-caret">▾</span>
          </button>

          <div id="userMenu" class="user-dropdown" hidden>
            <button id="menuProfile" class="user-dropdown__item" type="button">个人主页</button>
            <button id="menuSubmit" class="user-dropdown__item" type="button">提交改枪码</button>
            <button id="menuLogout" class="user-dropdown__item user-dropdown__item--danger" type="button">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <main id="appMain" class="app-main">
      <aside id="typesAside" class="types">
        <p class="types__title">武器分类</p>
        <div id="typeList" class="types__list"></div>
      </aside>

      <section class="content">
        <!-- 广告位：后台配置后轮播展示，无广告时显示合作占位 -->
        <div id="adSlot" class="ad-slot"></div>

        <div id="toolbar" class="toolbar">
          <div id="viewSwitch" class="view-switch" hidden>
            <button type="button" class="view-switch__item is-active" data-view="featured">精选改枪码</button>
            <button type="button" class="view-switch__item" data-view="mine">我的提交</button>
            <button type="button" class="view-switch__item" data-view="favorite">我的收藏</button>
          </div>
        </div>

        <div id="gunList" class="guns"></div>

        <div id="searchBar" class="search">
          <input id="searchInput" class="search__input" type="search" placeholder="搜索当前分类下的改枪码 / 备注" />
        </div>

        <div id="codeList" class="list"></div>

        <section id="profileView" class="profile" hidden></section>
      </section>
    </main>

    <footer class="app-footer">
      <span>© 好友玩平台旗下 - 改枪坊</span>
      <button id="version" class="footer-link" type="button" title="关于">v1.0.0</button>
    </footer>

    <!-- 登录弹窗 -->
    <div id="loginModal" class="modal" hidden>
      <div class="modal__mask" data-close="loginModal"></div>
      <div class="modal__panel">
        <h2 class="modal__title">登录</h2>

        <div class="login-mode">
          <button type="button" class="login-mode__item is-active" data-login-mode="password">账号登录</button>
          <button type="button" class="login-mode__item" data-login-mode="sms">短信登录</button>
        </div>

        <div id="passwordLoginPanel">
          <label class="field">
            <span class="field__label">账号 / 手机号</span>
            <input id="loginUsername" class="field__input" type="text" autocomplete="username" placeholder="请输入账号或手机号" />
          </label>

          <label class="field">
            <span class="field__label">密码</span>
            <input id="loginPassword" class="field__input" type="password" autocomplete="current-password" placeholder="请输入密码" />
          </label>

          <label id="captchaField" class="field">
            <span class="field__label">验证码</span>
            <div class="captcha">
              <input id="loginCaptcha" class="field__input" type="text" placeholder="请输入验证码" maxlength="6" />
              <img id="captchaImage" class="captcha__image" alt="验证码" title="点击刷新" />
            </div>
          </label>
        </div>

        <div id="smsLoginPanel" hidden>
          <label class="field">
            <span class="field__label">手机号</span>
            <input id="smsPhone" class="field__input" type="text" maxlength="11" placeholder="请输入手机号" />
          </label>

          <label class="field">
            <span class="field__label">短信验证码</span>
            <div class="sms-row">
              <input id="smsCode" class="field__input" type="text" maxlength="6" placeholder="请输入短信验证码" />
              <button id="smsSendBtn" class="button button--ghost button--sms" type="button">发送验证码</button>
            </div>
          </label>
        </div>

        <p id="loginError" class="form-error"></p>

        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="loginModal">取消</button>
          <button id="loginSubmit" class="button button--primary" type="button">登录</button>
        </div>

        <p class="login-register">
          还没有账号？<a href="#" id="registerLink">立即注册</a> · <a href="#" id="forgotLink">忘记密码</a>
        </p>
      </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="registerModal" class="modal" hidden>
      <div class="modal__mask" data-close="registerModal"></div>
      <div class="modal__panel">
        <h2 class="modal__title">注册改枪坊</h2>
        <p class="form-hint">带 * 为必填项，手机号用于登录与找回密码</p>

        <label class="field">
          <span class="field__label">账号 *</span>
          <input id="regUsername" class="field__input" type="text" autocomplete="username" placeholder="字母开头，3-20 位字母或数字" />
        </label>

        <label class="field">
          <span class="field__label">密码 *</span>
          <input id="regPassword" class="field__input" type="password" autocomplete="new-password" placeholder="6-20 位，需含字母与数字" />
        </label>

        <label class="field">
          <span class="field__label">确认密码 *</span>
          <input id="regConfirm" class="field__input" type="password" autocomplete="new-password" placeholder="再次输入密码" />
        </label>

        <label class="field">
          <span class="field__label">手机号 *</span>
          <input id="regPhone" class="field__input" type="text" maxlength="11" placeholder="用于账号找回与联系" />
        </label>

        <label class="field">
          <span class="field__label">昵称（可选）</span>
          <input id="regNickname" class="field__input" type="text" maxlength="20" placeholder="不填默认使用账号" />
        </label>

        <label class="field">
          <span class="field__label">短信验证码 *</span>
          <div class="sms-row">
            <input id="regSmsCode" class="field__input" type="text" maxlength="6" placeholder="请输入短信验证码" />
            <button id="regSmsSendBtn" class="button button--ghost button--sms" type="button">发送验证码</button>
          </div>
        </label>

        <p id="regError" class="form-error"></p>

        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="registerModal">取消</button>
          <button id="regSubmit" class="button button--primary" type="button">注册并登录</button>
        </div>
      </div>
    </div>

    <!-- 提交改枪码弹窗 -->
    <div id="submitModal" class="modal" hidden>
      <div class="modal__mask" data-close="submitModal"></div>
      <div class="modal__panel modal__panel--wide">
        <h2 class="modal__title">提交改枪码</h2>

        <label class="field">
          <span class="field__label">武器分类</span>
          <select id="submitType" class="field__input"></select>
        </label>

        <label class="field">
          <span class="field__label">枪械</span>
          <select id="submitGun" class="field__input"></select>
        </label>

        <label class="field">
          <span class="field__label">改枪码</span>
          <textarea id="submitCode" class="field__input field__input--area" rows="4" maxlength="500" placeholder="粘贴或输入改枪码"></textarea>
        </label>

        <label class="field">
          <span class="field__label">备注</span>
          <input id="submitRemark" class="field__input" type="text" maxlength="200" placeholder="可选，例如适用模式、版本" />
        </label>

        <p id="submitError" class="form-error"></p>

        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="submitModal">取消</button>
          <button id="submitConfirm" class="button button--primary" type="button">提交</button>
        </div>
      </div>
    </div>

    <!-- 编辑改枪码 -->
    <div id="editCodeModal" class="modal" hidden>
      <div class="modal__mask" data-close="editCodeModal"></div>
      <div class="modal__panel">
        <h2 class="modal__title">编辑改枪码</h2>

        <label class="field">
          <span class="field__label">改枪码</span>
          <textarea id="editCodeInput" class="field__input field__input--area" rows="3" maxlength="500"></textarea>
        </label>

        <label class="field">
          <span class="field__label">备注</span>
          <input id="editRemarkInput" class="field__input" type="text" maxlength="200" />
        </label>

        <p id="editError" class="form-error"></p>

        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="editCodeModal">取消</button>
          <button id="editSubmit" class="button button--primary" type="button">保存</button>
        </div>
      </div>
    </div>

    <!-- 修改密码 -->
    <div id="passwordModal" class="modal" hidden>
      <div class="modal__mask" data-close="passwordModal"></div>
      <div class="modal__panel">
        <h2 class="modal__title">修改密码</h2>

        <label class="field">
          <span class="field__label">原密码</span>
          <input id="oldPassword" class="field__input" type="password" autocomplete="current-password" placeholder="请输入原密码" />
        </label>

        <label class="field">
          <span class="field__label">新密码</span>
          <input id="newPassword" class="field__input" type="password" autocomplete="new-password" placeholder="6-20 位，需含字母与数字" />
        </label>

        <label class="field">
          <span class="field__label">确认新密码</span>
          <input id="confirmPassword" class="field__input" type="password" autocomplete="new-password" placeholder="再次输入新密码" />
        </label>

        <label id="passwordSmsField" class="field">
          <span class="field__label">手机验证码 *</span>
          <div class="sms-row">
            <input id="passwordCode" class="field__input" type="text" maxlength="6" placeholder="请输入当前手机验证码" />
            <button id="passwordSendBtn" class="button button--ghost button--sms" type="button">发送验证码</button>
          </div>
        </label>

        <p id="passwordHint" class="form-hint" hidden></p>
        <p id="passwordError" class="form-error"></p>

        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="passwordModal">取消</button>
          <button id="passwordSubmit" class="button button--primary" type="button">保存</button>
        </div>
      </div>
    </div>

    <!-- 绑定手机 -->
    <div id="bindModal" class="modal" hidden>
      <div class="modal__mask" data-close="bindModal"></div>
      <div class="modal__panel">
        <h2 id="bindTitle" class="modal__title">更换手机号</h2>
        <p id="bindCurrent" class="modal__message"></p>

        <div id="bindOldSection" hidden>
          <p id="bindOldPhone" class="form-hint"></p>
          <label class="field">
            <span class="field__label">原手机验证码 *</span>
            <div class="sms-row">
              <input id="bindOldCode" class="field__input" type="text" maxlength="6" placeholder="请输入原手机验证码" />
              <button id="bindOldSendBtn" class="button button--ghost button--sms" type="button">发送验证码</button>
            </div>
          </label>
        </div>

        <label class="field">
          <span class="field__label">新手机号 *</span>
          <input id="bindPhone" class="field__input" type="text" maxlength="11" placeholder="请输入新手机号" />
        </label>

        <label class="field">
          <span class="field__label">新手机验证码 *</span>
          <div class="sms-row">
            <input id="bindCode" class="field__input" type="text" maxlength="6" placeholder="请输入新手机验证码" />
            <button id="bindSendBtn" class="button button--ghost button--sms" type="button">发送验证码</button>
          </div>
        </label>

        <p id="bindError" class="form-error"></p>

        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="bindModal">取消</button>
          <button id="bindSubmit" class="button button--primary" type="button">绑定</button>
        </div>
      </div>
    </div>

    <!-- 忘记密码 -->
    <div id="forgotModal" class="modal" hidden>
      <div class="modal__mask" data-close="forgotModal"></div>
      <div class="modal__panel">
        <h2 class="modal__title">忘记密码</h2>
        <p class="form-hint">通过注册手机号验证后设置新密码</p>

        <label class="field">
          <span class="field__label">手机号 *</span>
          <input id="forgotPhone" class="field__input" type="text" maxlength="11" placeholder="请输入注册手机号" />
        </label>

        <label class="field">
          <span class="field__label">短信验证码 *</span>
          <div class="sms-row">
            <input id="forgotCode" class="field__input" type="text" maxlength="6" placeholder="请输入短信验证码" />
            <button id="forgotSendBtn" class="button button--ghost button--sms" type="button">发送验证码</button>
          </div>
        </label>

        <label class="field">
          <span class="field__label">新密码 *</span>
          <input id="forgotPassword" class="field__input" type="password" autocomplete="new-password" placeholder="6-20 位，需含字母与数字" />
        </label>

        <label class="field">
          <span class="field__label">确认新密码 *</span>
          <input id="forgotConfirm" class="field__input" type="password" autocomplete="new-password" placeholder="再次输入新密码" />
        </label>

        <p id="forgotError" class="form-error"></p>

        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="forgotModal">取消</button>
          <button id="forgotSubmit" class="button button--primary" type="button">重置密码</button>
        </div>
      </div>
    </div>

    <!-- 通用确认弹窗（退出登录等） -->
    <div id="confirmModal" class="modal" hidden>
      <div class="modal__mask" data-close="confirmModal"></div>
      <div class="modal__panel modal__panel--sm">
        <h2 class="modal__title" id="confirmTitle">提示</h2>
        <p class="modal__message" id="confirmMessage"></p>
        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="confirmModal">取消</button>
          <button id="confirmOk" class="button button--primary" type="button">确定</button>
        </div>
      </div>
    </div>

    <!-- 广告合作说明 -->
    <div id="adModal" class="modal" hidden>
      <div class="modal__mask" data-close="adModal"></div>
      <div class="modal__panel">
        <h2 class="modal__title">广告合作</h2>
        <p class="modal__message">此位置为预留广告位，支持图片、文字链或固定展示位合作。</p>
        <p class="modal__message">商务联系：<strong id="adContact">2542571191@qq.com</strong></p>
        <div class="modal__actions">
          <button class="button button--ghost" type="button" data-close="adModal">关闭</button>
          <button id="adCopyBtn" class="button button--primary" type="button">复制邮箱</button>
        </div>
      </div>
    </div>

    <!-- 关于（接口地址等诊断信息放在这里，不占界面） -->
    <div id="aboutModal" class="modal" hidden>
      <div class="modal__mask" data-close="aboutModal"></div>
      <div class="modal__panel modal__panel--sm">
        <h2 class="modal__title">关于改枪坊</h2>
        <p class="modal__message" id="aboutVersion"></p>
        <p class="modal__message" id="aboutApi"></p>
        <div class="modal__actions">
          <button class="button button--primary" type="button" data-close="aboutModal">知道了</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
